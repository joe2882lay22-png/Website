<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ကျွန်ုပ်၏ ပထမဆုံး Website</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f6fb;
      color: #172033;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 680px;
      padding: 36px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 40px #17203314;
    }
    h1 { color: #2457c5; }
    p, li { line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <h1>မင်္ဂလာပါ 👋</h1>
    <p>ဒါက ကျွန်ုပ်၏ ပထမဆုံး နမူနာ website ပါ။</p>
    <h2>Workflow က ဘာလုပ်သလဲ?</h2>
    <ol>
      <li>Code ကို GitHub ပေါ်တင်တဲ့အခါ အလိုအလျောက် စတင်ပါတယ်။</li>
      <li>Website ဖိုင်တွေကို ပြင်ဆင်ပါတယ်။</li>
      <li>GitHub Pages ပေါ်ကို တင်ပေးပါတယ်။</li>
    </ol>
  </main>
</body>
</html>

<!doctype html>
<html lang="my">
<head>

  <title>ကျွန်ုပ်၏ Website</title>
  <style>
    body {

      place-items: center;
      box-sizing: border-box;
      background: #f3f6fb;
      color: #172033;
      font-family: system-ui, sans-serif;

    main {
      width: min(620px, 100%);

      padding: 32px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 10px 32px #17203318;
    }

    h1 {
      margin-top: 0;
      color: #2457c5;
    }

    p, li {
      line-height: 1.8;
    }

    a {
      color: #2457c5;
    }

    .download {
      display: inline-block;
      margin: 6px 0;
      padding: 10px 14px;
      border-radius: 8px;
      background: #2457c5;
      color: white;
      text-decoration: none;
    }

    .download:hover {
      background: #17439e;
    }
  </style>
</head>
<body>
  <main>
    <h1>မင်္ဂလာပါ 👋</h1>
    <p>ဒီ website မှာ ZIP ဖိုင်တွေကို ဒေါင်းလုဒ်လုပ်နိုင်ပါတယ်။</p>

    <h2>ဒေါင်းလုဒ်လုပ်ရန်</h2>

    <p>
      <a class="download" href="./ဖိုင်၁.zip" download>
        ZIP ဖိုင် ၁ ကို ဒေါင်းလုဒ်လုပ်ရန်
      </a>
    </p>

    <p>
      <a class="download" href="./ဖိုင်၂.zip" download>
        ZIP ဖိုင် ၂ ကို ဒေါင်းလုဒ်လုပ်ရန်
      </a>
    </p>

    <p>လင့်ခ်ကိုနှိပ်ပြီး ဖိုင်ကို ဒေါင်းလုဒ်လုပ်ပါ။</p>
  </main>
</body>
</html>
